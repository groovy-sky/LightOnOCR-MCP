name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_digest:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment
        required: true
        type: choice
        options: [staging, production]
      image_digest:
        description: Published sha256 image digest
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: read
  deployments: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate immutable image reference
        env:
          DIGEST: ${{ inputs.image_digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/lightonocr-mcp@${{ inputs.image_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker pull "$IMAGE"
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY"
      - name: Roll out through protected deployment webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/lightonocr-mcp@${{ inputs.image_digest }}
        run: |
          test -n "$DEPLOY_WEBHOOK_URL"
          curl --fail --silent --show-error --request POST "$DEPLOY_WEBHOOK_URL" \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg image "$IMAGE" '{image:$image}')"
      - name: Post-deployment health check
        env:
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL"
          timeout 300 sh -c 'until curl --fail --silent --show-error "$HEALTH_URL/healthz" >/dev/null; do sleep 5; done'